[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-python-app"
version = "0.1.0"
description = "A starter Python project created in the AI-Python workspace."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
dependencies = ["python-dotenv>=1.0.0"]

[project.scripts]
ai-python-app = "ai_python_app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
